name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Mostlylucid.Packing.slnx
      - run: dotnet build Mostlylucid.Packing.slnx -c Release --no-restore
      - run: dotnet test Mostlylucid.Packing.slnx -c Release --no-build --no-restore
      - run: dotnet run --project samples/Salon -c Release --no-build --no-restore
